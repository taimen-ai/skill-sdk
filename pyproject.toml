[project]
name = "skill-sdk"
version = "0.2.1"
description = "SDK скиллов платформы Taimen: контракт v1 из кода, контекст вызова, хостинг local/http/mcp, экспорт в пакет каталога (TAI-ADR-0045)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.8",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# HTTP-хостинг: ASGI-приложение и проверка IAM-токена audience скилла.
http = ["starlette>=0.37", "uvicorn>=0.30", "platform-auth-sdk"]
# MCP-хостинг: сервер инструментов (stdio и streamable HTTP).
mcp = ["mcp>=2.0.0", "uvicorn>=0.30", "platform-auth-sdk"]
# ctx.llm — клиент platform-llm по конфигурации инсталляции (TAI-ADR-0037 п.4).
llm = ["platform-llm"]
# ctx.connection и ConnectionClient: HTTP API хранилища секретов (TAI-ADR-0061).
connections = ["httpx>=0.27"]
all = ["skill-sdk[http,mcp,llm,connections]"]

[project.scripts]
skill-sdk = "skill_sdk.cli:main"

[tool.uv.sources]
platform-auth-sdk = { path = "../platform-auth-sdk", editable = true }
platform-llm = { path = "../platform-llm", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_sdk"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["skill_sdk"]
ignore_missing_imports = true
